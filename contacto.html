    <h1 style="color: darkblue; background-color: antiquewhite; padding: 10px;">Contacto</h1>
    
    <!-- Formulario mejorado con placeholders y estilos en línea -->
    <form action="#" method="POST" style="background-color: #f9f9f9; padding: 20px; border-radius: 5px; border: 1px solid #ccc;">
        <p>
            <label for="nombre" style="font-weight: bold;">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Kevin Steven" required style="width: 98%; padding: 8px; margin-top: 5px;">
        </p>
        <p>
            <label for="apellidos" style="font-weight: bold;">Apellidos:</label><br>
            <input type="text" id="apellidos" name="apellidos" placeholder="Ej: Mendoza Ortegano" required style="width: 98%; padding: 8px; margin-top: 5px;">
        </p>
        <p>
            <label for="correo" style="font-weight: bold;">Correo Electrónico:</label><br>
            <input type="email" id="correo" name="correo" placeholder="kevin.mendozaort@ug.edu.ec" required style="width: 98%; padding: 8px; margin-top: 5px;">
        </p>
        <p>
            <label for="mensaje" style="font-weight: bold;">Mensaje:</label><br>
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu consulta sobre soporte técnico o desarrollo..." required style="width: 98%; padding: 8px; margin-top: 5px;"></textarea>
        </p>
        <p style="text-align: center;">
            <input type="submit" value="Enviar" style="background-color: darkblue; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
            <input type="reset" value="Limpiar" style="background-color: gray; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
        </p>
    </form>
